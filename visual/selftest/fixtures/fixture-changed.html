<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Visual self-test — changed fixture</title>
<style>
  /* Identical to fixture-base.html EXCEPT: #banner color (large change, ~15% of a
     1024×768 viewport → ReviewRequired), #small color (small change, ~0.4% → Minor)
     and the #dynamic text (masked in the mask cases). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f8fafc; }
  #banner { width: 100%; height: 120px; background: #dc2626; color: #fff;
            display: flex; align-items: center; padding-left: 24px; font-size: 28px; }
  main { padding: 24px; }
  table { border-collapse: collapse; margin-top: 16px; }
  td, th { border: 1px solid #cbd5e1; padding: 8px 16px; font-size: 14px; }
  #dynamic { position: absolute; top: 140px; right: 24px; width: 200px; height: 30px;
             background: #e2e8f0; font-size: 13px; text-align: center; line-height: 30px; }
  #small { position: absolute; top: 300px; left: 700px; width: 50px; height: 60px;
           background: #ea580c; }
  #modal { display: none; position: absolute; top: 200px; left: 200px; width: 300px;
           height: 150px; background: #fff; border: 2px solid #334155; padding: 16px; }
  button { margin-top: 16px; padding: 8px 16px; }
</style>
</head>
<body>
  <div id="banner">Asset Register</div>
  <main>
    <h1 style="font-size:20px">Fixture page</h1>
    <table>
      <tr><th>Code</th><th>Name</th><th>Status</th></tr>
      <tr><td>AST-00001</td><td>Laptop</td><td>Active</td></tr>
      <tr><td>AST-00002</td><td>Printer</td><td>Active</td></tr>
    </table>
    <button id="open-modal" onclick="document.getElementById('modal').style.display='block'">
      Open modal
    </button>
  </main>
  <div id="dynamic">23:59:59 — live clock</div>
  <div id="small"></div>
  <div id="modal">Modal content</div>
</body>
</html>
